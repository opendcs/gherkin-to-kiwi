---
name: Tagged Release
on:
  push:
    tags:
      - '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]'
      - '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]-M[0-9]*'
jobs:
  release:
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/release.yml
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
    with:
      branch: ${{github.ref_name}}

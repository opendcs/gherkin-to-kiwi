plugins {
    id 'groovy-gradle-plugin'
}

repositories {
    gradlePluginPortal()
    mavenCentral()
}

dependencies {
    implementation "org.sonarsource.scanner.gradle:sonarqube-gradle-plugin:7.2.2.6593"
    implementation 'dev.sigstore:sigstore-gradle-sign-plugin:1.3.0'
    implementation 'io.github.opendcs.maven:maven-central-upload:0.1.2'
}